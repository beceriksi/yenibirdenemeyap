name: OKX Pro Radar Bot

on:
  schedule:
    # Her 15 dakikada bir otomatik çalışır
    - cron: '*/15 * * * *'
  workflow_dispatch: # GitHub panelinden elle çalıştırma butonu

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v3

      - name: Python Ortamını Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install ccxt requests pandas

      - name: Radar Scriptini Çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python okx_radar.py
